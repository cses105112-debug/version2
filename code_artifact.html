<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="投手分析">
<meta name="theme-color" content="#181818">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>投手姿態分析</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#181818;color:#fff;font:14px system-ui,sans-serif}
#app{max-width:820px;margin:auto;padding:12px}
h3{margin:4px 0 10px;text-align:center}
button,select,input{font:inherit;padding:8px 10px;border-radius:6px;border:1px solid #555;background:#333;color:#fff}
button{cursor:pointer}button:disabled{opacity:.5}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:#aaa}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0}
#go{background:#28a745;border:0;font-weight:700}
progress{width:100%}
#st{margin:8px 0;color:#ffc107;font-weight:700;text-align:center;min-height:1.4em}
#stage{display:flex;flex-direction:column;background:#000;border-radius:8px;overflow:hidden}
#cv{width:100%;height:auto;min-height:0;display:block}
#v{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.ctl{padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#111}
#seek{width:100%;padding:0}
#stage.fs{position:fixed;inset:0;z-index:99;border-radius:0}
#stage.fs #cv{flex:1;height:100%;object-fit:contain}
.opt{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px}
.opt label{display:flex;align-items:center;gap:4px}
.opt input[type=checkbox]{padding:0}
#off{width:70px}
pre{background:#222;padding:8px;border-radius:6px;overflow:auto;font-size:12px}
small{color:#aaa}
.tb{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
.tb th,.tb td{border-bottom:1px solid #333;padding:5px 4px;text-align:center}
.tb tr.rowc{cursor:pointer}
.bdg{display:inline-block;padding:1px 8px;border-radius:10px;color:#000;font-weight:700}
.ban{padding:8px;border-radius:6px;color:#000;font-weight:700;text-align:center;margin:8px 0}
.it{background:#222;padding:6px 8px;margin:6px 0;border-radius:4px;font-size:13px}
.it small{display:block;margin-top:2px}
@media (pointer:coarse){input,select{font-size:16px}button{min-height:42px}}
</style>
</head>
<body>
<div id="app">
  <h3>投手姿態分析</h3>

  <div class="grid">
    <label>拍攝幀率 fps（慢動作請填實際值，如 240）<input id="cfps" type="number" value="240"></label>
    <label>分析起點 秒（選填，只分析投球片段可大幅加快）<input id="t0" type="number" step="0.1" min="0"></label>
    <label>分析終點 秒（選填）<input id="t1" type="number" step="0.1" min="0"></label>
    <label>分析模型<select id="model"><option value="full">標準</option><option value="heavy">高精度（較慢）</option><option value="lite">輕量（最快）</option></select></label>
    <label>姓名<input id="pname" list="plist" placeholder="輸入或選擇既有投手" autocomplete="off"><datalist id="plist"></datalist></label>
    <label>慣用手<select id="hand"><option>Right</option><option>Left</option></select></label>
    <label>身高 cm<input id="ht" type="number" value="176"></label>
    <label>體重 kg<input id="wt" type="number" value="65"></label>
    <label>上臂長 cm<input id="ua" type="number" value="35"></label>
    <label>前臂長 cm<input id="fa" type="number" value="28"></label>
    <label>年齡（套用常模需要）<input id="age" type="number" placeholder="例如 17"></label>
    <label>慣用側肩內旋 ROM °（選填，可多次，用逗號分隔）<input id="ir_t" placeholder="例如 52, 55, 50"></label>
    <label>非慣用側肩內旋 ROM °（選填，可多次）<input id="ir_o" placeholder="例如 68, 70, 66"></label>
    <label>鏡頭角色<select id="role">
      <option value="Camera A back">A　後方（投手背後）</option>
      <option value="Camera B side">B　側面（三壘或一壘側）</option>
      <option value="Camera C front">C　正面（本壘後方）</option></select></label>
  </div>
  <div class="row"><input id="file" type="file" accept="video/*"></div>
  <div class="row">
    <button id="go">上傳並分析</button>
    <button id="savep">儲存投手資料</button>
    <button id="hist">歷史紀錄</button>
  </div>
  <div id="histbox"></div>
  <progress id="pg" value="0" max="100" hidden></progress>
  <div id="st"></div>

  <section id="viewer" hidden>
    <div id="stage">
      <video id="v" playsinline muted></video>
      <canvas id="cv" width="1280" height="720"></canvas>
      <div class="ctl">
        <input id="seek" type="range" min="0" max="0" value="0" step="1">
        <div class="row">
          <button id="prev">◀ 前一幀</button>
          <button id="play">▶ 播放</button>
          <button id="next">下一幀 ▶</button>
          <select id="rate"><option value="0.1">0.1×</option><option value="0.25" selected>0.25×</option><option value="0.5">0.5×</option><option value="1">1×</option></select>
          <button id="fs">⛶</button>
        </div>
        <div class="row"><small id="info"></small></div>
      </div>
    </div>
    <div class="opt" style="margin-top:10px">
      <label><input id="o_skel" type="checkbox" checked>骨架</label>
      <label><input id="o_pts" type="checkbox" checked>關節點</label>
      <label><input id="o_lbl" type="checkbox" checked>名稱</label>
      <label><input id="o_trail" type="checkbox" checked>手腕軌跡</label>
      <label>標記偏移（幀）<input id="off" type="number" value="0" step="1"></label>
    </div>
    <div class="row">
      <button id="mfc">設目前幀為 FC</button><button id="mmer">設為 MER</button><button id="mbr">設為 BR</button>
      <button id="mclr">清除</button><small id="mtxt"></small>
      <label style="font-size:12px;color:#aaa">MER 角度 °（選填，實測值）<input id="mdeg" type="number" style="width:90px"></label>
      <label style="font-size:12px;color:#aaa">單鏡頭校正係數（預設 1）<input id="cal" type="number" step="0.01" min="0.5" max="2" placeholder="1" style="width:90px"></label>
    </div>
    <div class="row">
      <button id="dyn">計算力與力矩</button>
      <button id="jfc" hidden>跳到 FC</button><button id="jmer" hidden>跳到 MER</button><button id="jbr" hidden>跳到 BR</button>
    </div>
    <div id="alerts"></div>
    <div id="dl" class="row">
      <button data-k="kinematics">運動學 CSV</button><button data-k="legacy">舊格式 CSV</button>
      <button data-k="raw">原始座標 CSV</button><button data-k="dynamics" id="dk" hidden>力學 CSV</button>
    </div>
    <pre id="res" hidden></pre>
  </section>
</div>

<script>
// 瀏覽器內建後端：攔截 /api/* 請求並在本機執行。
// 資料存 IndexedDB；姿態用 MediaPipe（瀏覽器版）；力學運算用 Pyodide 直接執行 core.py / biomech.py / thresholds.py。
(() => {
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const now = () => new Date().toISOString().slice(0, 19) + 'Z';
const lastLine = e => String(e && e.message || e).trim().split('\n').pop();

// ---------- IndexedDB ----------
let _db;
const dbp = () => _db || (_db = new Promise((ok, bad) => {
  const r = indexedDB.open('pitch', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error);
}));
const kv = async (mode, fn) => { const d = await dbp(); return new Promise((ok, bad) => {
  const t = d.transaction('kv', mode), q = fn(t.objectStore('kv'));
  t.oncomplete = () => ok(q && q.result); t.onerror = () => bad(t.error); }); };
const kget = k => kv('readonly', s => s.get(k));
const kset = (k, v) => kv('readwrite', s => s.put(v, k));
const kall = p => kv('readonly', s => s.getAll(IDBKeyRange.bound(p, p + '\uffff')));

// ---------- MP4 / MOV：讀出每一幀的實際時間（只讀 moov，不讀影像資料）----------
const u32 = (d, o) => d.getUint32(o);
const tag = (d, o) => String.fromCharCode(d.getUint8(o), d.getUint8(o + 1), d.getUint8(o + 2), d.getUint8(o + 3));
function boxes(d, s, e) {
  const out = [];
  while (s + 8 <= e) {
    let size = u32(d, s), hdr = 8;
    if (size === 1) { size = Number(d.getBigUint64(s + 8)); hdr = 16; } else if (size === 0) size = e - s;
    if (size < hdr) break;
    out.push({type: tag(d, s + 4), s: s + hdr, e: Math.min(e, s + size)});
    s += size;
  }
  return out;
}
const sub = (d, b, ...path) => { for (const t of path) { b = b && boxes(d, b.s, b.e).find(x => x.type === t); } return b || null; };
async function mp4Times(file) {
  let o = 0, moov = null;
  while (o + 8 <= file.size && !moov) {
    const h = new DataView(await file.slice(o, o + 16).arrayBuffer());
    let size = u32(h, 0), hdr = 8;
    if (size === 1) { size = Number(h.getBigUint64(8)); hdr = 16; } else if (size === 0) size = file.size - o;
    if (size < hdr) break;
    if (tag(h, 4) === 'moov') moov = [o + hdr, o + size];
    o += size;
  }
  if (!moov) throw new Error('讀不到影片時間資訊：請使用手機錄製的 mp4 / mov 檔');
  const d = new DataView(await file.slice(moov[0], moov[1]).arrayBuffer());
  for (const trak of boxes(d, 0, d.byteLength).filter(b => b.type === 'trak')) {
    const hd = sub(d, trak, 'mdia', 'hdlr');
    if (!hd || tag(d, hd.s + 8) !== 'vide') continue;
    const mdhd = sub(d, trak, 'mdia', 'mdhd'), ts = u32(d, mdhd.s + (d.getUint8(mdhd.s) === 1 ? 20 : 12));
    const stbl = sub(d, trak, 'mdia', 'minf', 'stbl'), stts = sub(d, stbl, 'stts'), ctts = sub(d, stbl, 'ctts');
    const dts = []; let t = 0;
    for (let n = u32(d, stts.s + 4), p = stts.s + 8; n--; p += 8) for (let c = u32(d, p); c--;) { dts.push(t); t += u32(d, p + 4); }
    let pts = dts;
    if (ctts) {
      const off = [];
      for (let n = u32(d, ctts.s + 4), p = ctts.s + 8; n--; p += 8) for (let c = u32(d, p); c--;) off.push(d.getInt32(p + 4));
      pts = dts.map((x, i) => x + (off[i] || 0));
    }
    let shift = 0; const elst = sub(d, trak, 'edts', 'elst');
    if (elst) {
      const v1 = d.getUint8(elst.s) === 1;
      for (let n = u32(d, elst.s + 4), p = elst.s + 8; n--; p += v1 ? 20 : 12) {
        const mt = v1 ? Number(d.getBigInt64(p + 8)) : d.getInt32(p + 4);
        if (mt >= 0) { shift = mt; break; }
      }
    }
    return pts.map(x => (x - shift) / ts).sort((a, b) => a - b);
  }
  throw new Error('影片中找不到視訊軌');
}
if (typeof module !== 'undefined') module.exports = {mp4Times};
if (typeof window === 'undefined') return;

// ---------- Pyodide（跑 Python 運算）----------
const pySrc = async n => { const e = document.getElementById('py-' + n); return e ? e.textContent : (await realFetch('/' + n + '.py')).text(); };
let PYP = null;
const PYC = () => PYP || (PYP = (async () => {
  await new Promise((ok, bad) => { const s = document.createElement('script'); s.src = PYODIDE + 'pyodide.js'; s.onload = ok;
    s.onerror = () => bad(new Error('無法載入運算引擎（第一次使用需要網路）')); document.head.append(s); });
  const py = await loadPyodide({indexURL: PYODIDE});
  await py.loadPackage(['numpy', 'pandas', 'scipy']);
  for (const n of ['biomech', 'thresholds', 'core']) py.FS.writeFile(n + '.py', await pySrc(n));
  return py.pyimport('core');
})());

// ---------- MediaPipe（瀏覽器版）----------
async function pose(model) {
  const {PoseLandmarker, FilesetResolver} = await import(MP + '/+esm');
  const fs = await FilesetResolver.forVisionTasks(MP + '/wasm');
  const url = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${model}/float16/latest/pose_landmarker_${model}.task`;
  for (const delegate of ['GPU', 'CPU']) {
    try { return await PoseLandmarker.createFromOptions(fs, {baseOptions: {modelAssetPath: url, delegate}, runningMode: 'VIDEO', numPoses: 1}); }
    catch (e) { if (delegate === 'CPU') throw e; }
  }
}
const seek = (v, t) => new Promise(res => {
  let done = false;
  const fin = () => { if (done) return; done = true; v.removeEventListener('seeked', fin); res(); };
  v.addEventListener('seeked', fin); setTimeout(fin, 3000); v.currentTime = t;
});

// ---------- 影片分析工作 ----------
const jobs = {};
async function runJob(sid, file, p) {
  const job = jobs[sid] = {status: 'running', done: 0, total: 0, message: '讀取影片時間資訊…'};
  let v = null, L = null;
  try {
    const pts = await mp4Times(file);
    const gaps = pts.slice(1).map((x, i) => x - pts[i]).sort((a, b) => a - b), dt = gaps[gaps.length >> 1] || 1 / 30;
    const vfps = 1 / dt, cfps = p.capture_fps || vfps;
    const i0 = Math.max(0, Math.floor((p.start_s || 0) / dt));
    const i1 = Math.min(pts.length - 1, p.end_s ? Math.ceil(p.end_s / dt) : pts.length - 1);
    if (i1 - i0 < 10) throw new Error('分析區間太短（至少需要 10 幀）');
    job.total = i1 - i0 + 1; job.message = '載入姿態模型與運算引擎…';
    const pyP = PYC(); pyP.catch(() => {});
    v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.src = URL.createObjectURL(file);
    await new Promise((ok, bad) => { v.onloadedmetadata = ok; v.onerror = () => bad(new Error('瀏覽器無法解碼此影片（可能是 HEVC）；請改用 Safari / Chrome，或把手機相機格式改成「最相容」')); });
    L = await pose(p.model || 'full'); job.message = '';
    const frames = [], viewer = []; let last = -1;
    for (let k = i0; k <= i1; k++) {
      await seek(v, k + 1 < pts.length ? (pts[k] + pts[k + 1]) / 2 : pts[k] + dt / 2);
      last = Math.max(last + 1, Math.round(pts[k] * 1000));
      const q = L.detectForVideo(v, last).landmarks[0];
      if (q) {
        frames.push({i: k, t: k / cfps * 1000, lm: q.map(a => [a.x, a.y, a.z, a.visibility || 0])});
        viewer.push({i: k, p: q.map(a => [+a.x.toFixed(4), +a.y.toFixed(4), +(a.visibility || 0).toFixed(3)])});
      }
      job.done = k - i0 + 1;
    }
    job.message = '計算運動學…';
    const meta = await kget('meta:' + sid);
    Object.assign(meta, {width: v.videoWidth, height: v.videoHeight, fps: cfps, video_fps: vfps, source: 'video'});
    const res = JSON.parse((await pyP).finalize(JSON.stringify(frames), JSON.stringify(meta)));
    const info = {frames_total: job.total, frames_detected: frames.length, capture_fps: cfps, video_fps: vfps, duration_s: +(job.total / cfps).toFixed(3), width: v.videoWidth, height: v.videoHeight};
    await kset('lm:' + sid, {video_fps: vfps, capture_fps: cfps, width: v.videoWidth, height: v.videoHeight, n_frames: pts.length, handedness: meta.handedness, frames: viewer});
    await kset('data:' + sid, {raw_csv: res.raw_csv, kinematics_csv: res.kinematics_csv, legacy_csv: res.legacy_csv, metrics: res.metrics, info});
    await kset('meta:' + sid, meta);
    Object.assign(job, {status: 'done', info, metrics: res.metrics, message: ''});
  } catch (e) { Object.assign(job, {status: 'error', message: lastLine(e)}); }
  finally { if (v) URL.revokeObjectURL(v.src); if (L) L.close(); }
}

// ---------- 投手資料 ----------
const PF = ['handedness', 'height_cm', 'weight_kg', 'upper_arm_cm', 'forearm_cm', 'age', 'ir_rom_throw_deg', 'ir_rom_other_deg', 'ir_trials_throw', 'ir_trials_other', 'notes'];
async function upsert(name, f) {
  if (!name) throw new Error('姓名不可空白');
  const P = (await kget('pitchers')) || {}, cur = P[name] || {name, created_at: now()};
  for (const k of PF) if (f[k] != null && f[k] !== 0) cur[k] = f[k];
  cur.updated_at = now(); P[name] = cur; await kset('pitchers', P);
  return cur;
}
async function history(name) {
  const rows = (await kall('meta:')).filter(m => m.pitcher_name === name)
    .map(m => ({session_id: m.sid, created_at: m.created_at, camera_role: m.camera_role, fps: m.fps, ...(m.summary || {})}));
  return rows.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
}

// ---------- 路由：與伺服器版 API 相同 ----------
const J = (o, status = 200) => new Response(JSON.stringify(o), {status, headers: {'Content-Type': 'application/json'}});
const fail = (m, s = 400) => J({detail: m}, s);
const CSV = {kinematics: 'kinematics_csv', raw: 'raw_csv', dynamics: 'dyn_csv'};
async function local(url, opt) {
  const u = new URL(url, location.origin), seg = u.pathname.split('/').filter(Boolean).slice(1), m = (opt.method || 'GET').toUpperCase();
  let body = {}; if (typeof opt.body === 'string') { try { body = JSON.parse(opt.body); } catch {} }
  try {
    if (seg[0] === 'pitchers') {
      if (seg[1] === 'history') return J(await history(u.searchParams.get('name')));
      if (m === 'POST') return J(await upsert((body.name || '').trim(), body));
      return J(Object.values((await kget('pitchers')) || {}).sort((a, b) => (b.updated_at || '').localeCompare(a.updated_at || '')));
    }
    if (seg[0] !== 'sessions') return fail('not found', 404);
    if (m === 'POST' && !seg[1]) {
      const sid = crypto.randomUUID().replace(/-/g, '').slice(0, 12);
      const meta = {...body, sid, pitcher_name: (body.pitcher_name || '').trim() || '未命名', created_at: now()};
      await kset('meta:' + sid, meta);
      if (meta.pitcher_name !== '未命名') await upsert(meta.pitcher_name, meta);
      return J({session_id: sid});
    }
    const sid = seg[1], act = seg[2], meta = await kget('meta:' + sid);
    if (!meta) return fail('session not found', 404);
    if (act === 'video') return J({received: 0});
    if (act === 'analyze') {
      const file = document.getElementById('file').files[0];
      if (!file) return fail('找不到影片檔');
      runJob(sid, file, body); return J({ok: true});
    }
    const data = (await kget('data:' + sid)) || null;
    if (act === 'status') return J(jobs[sid] || (data ? {status: 'done', info: data.info, metrics: data.metrics} : {status: 'none'}));
    if (act === 'landmarks') { const L = await kget('lm:' + sid); return L ? J(L) : fail('尚未完成影片分析', 404); }
    if (!data) return fail('尚未完成影片分析');
    if (act === 'dynamics' && m === 'POST') {
      const core = await PYC();
      const prm = {cutoff_hz: body.cutoff_hz ?? 6, ball_kg: body.ball_kg ?? 0.145, fc_ms: body.fc_ms ?? null, mer_ms: body.mer_ms ?? null, mer_deg: body.mer_deg ?? null, mer_offset_deg: body.mer_offset_deg ?? 0, calibration_factor: body.calibration_factor ?? null, br_ms: body.br_ms ?? null};
      const r = JSON.parse(core.dynamics(data.raw_csv, JSON.stringify(meta), JSON.stringify(prm)));
      data.dyn_csv = r.csv; data.dyn_metrics = r.metrics; await kset('data:' + sid, data);
      const mt = r.metrics, ph = mt.phases || {}, a = mt.assessment || {};
      meta.summary = {varus_cocking: (ph.cocking || {}).varus_peak_Nm, varus_accel: (ph.acceleration || {}).varus_peak_Nm,
        medial_cocking: (ph.cocking || {}).medial_peak_N, medial_accel: (ph.acceleration || {}).medial_peak_N,
        stride_pct: (mt.kinematics || {}).stride_pct_height, overall: a.overall, flagged: a.flagged || []};
      await kset('meta:' + sid, meta);
      return J(mt);
    }
    if (act === 'dynamics_metrics') return data.dyn_metrics ? J(data.dyn_metrics) : fail('尚未計算', 404);
    const text = act === 'legacy' ? '\ufeff' + data.legacy_csv : data[CSV[act]];
    return text ? new Response(new Blob([text], {type: 'text/csv'})) : fail('not ready', 404);
  } catch (e) { return fail(lastLine(e), 500); }
}

// ---------- Fetch 攔截器修復與安全解析 ----------
const realFetch = window.fetch.bind(window);
const toLocal = u => {
  try {
    const raw = typeof u === 'string' ? u : u instanceof URL ? u.href : u && u.url;
    if (!raw) return null;
    const x = new URL(raw, location.href);
    if (x.origin !== location.origin) return null;
    return x.pathname === '/healthz' || x.pathname.startsWith('/api/') ? x.pathname + x.search : null;
  } catch { return null; }
};
window.fetch = (url, opt = {}) => {
  const p = toLocal(url);

"""純運算核心（不依賴 FastAPI）。伺服器版與瀏覽器版（Pyodide）共用。"""
import io
import json
import math

import numpy as np
import pandas as pd

import biomech
import thresholds

JOINTS = {
    "l_shoulder": 11, "r_shoulder": 12,
    "l_elbow": 13, "r_elbow": 14,
    "l_wrist": 15, "r_wrist": 16,
    "l_hip": 23, "r_hip": 24,
    "l_pinky": 17, "r_pinky": 18, "l_index": 19, "r_index": 20,
    "l_ankle": 27, "r_ankle": 28,
}

def row_from_lm(i, t_ms, lm):
    r = {"frame": i, "t_ms": t_ms}
    for name, idx in JOINTS.items():
        x, y, z, v = (lm[idx] + [0, 0, 0, 0])[:4]
        r.update({f"{name}_x": x, f"{name}_y": y, f"{name}_z": z, f"{name}_v": v})
    return r

def _angle3(a, b, c):
    v1, v2 = a - b, c - b
    cos = (v1 * v2).sum(1) / (np.linalg.norm(v1, axis=1) * np.linalg.norm(v2, axis=1) + 1e-9)
    return np.degrees(np.arccos(np.clip(cos, -1, 1)))

def _wrap(deg):
    return (deg + 180) % 360 - 180

def analyze(df: pd.DataFrame, meta: dict):
    w, h = meta["width"], meta["height"]

    def P(name):
        return np.c_[df[f"{name}_x"] * w, df[f"{name}_y"] * h, df[f"{name}_z"] * w]

    side = "r" if meta["handedness"] == "R" else "l"
    sh, el, wr = P(f"{side}_shoulder"), P(f"{side}_elbow"), P(f"{side}_wrist")
    t = df["t_ms"].to_numpy() / 1000.0

    mid_sh = (P("l_shoulder") + P("r_shoulder")) / 2
    mid_hip = (P("l_hip") + P("r_hip")) / 2
    torso = np.median(np.linalg.norm(mid_sh - mid_hip, axis=1))

    def smooth(a):
        return pd.DataFrame(a).rolling(3, center=True, min_periods=1).mean().to_numpy()

    wr_s = smooth(wr)
    vel = np.gradient(wr_s, t, axis=0)
    speed = np.linalg.norm(vel, axis=1) / torso

    sh_line = P("r_shoulder") - P("l_shoulder")
    hip_line = P("r_hip") - P("l_hip")
    sh_ang = np.degrees(np.arctan2(sh_line[:, 2], sh_line[:, 0]))
    hip_ang = np.degrees(np.arctan2(hip_line[:, 2], hip_line[:, 0]))

    out = pd.DataFrame({
        "frame": df["frame"], "t_ms": df["t_ms"],
        "elbow_angle_deg": smooth(_angle3(sh, el, wr)).ravel(),
        "wrist_speed_torso_per_s": speed,
        "shoulder_rot_deg": sh_ang, "hip_rot_deg": hip_ang,
        "hip_shoulder_sep_deg": _wrap(sh_ang - hip_ang),
    })
    k = int(np.argmax(speed))
    metrics = {
        "frames": len(df),
        "duration_s": round(float(t[-1] - t[0]), 3),
        "effective_fps": round(float((len(df) - 1) / (t[-1] - t[0] + 1e-9)), 1),
        "peak_wrist_speed_torso_per_s": round(float(speed[k]), 2),
        "peak_wrist_speed_frame": int(df["frame"].iloc[k]),
        "max_elbow_angle_deg": round(float(out.elbow_angle_deg.max()), 1),
        "min_elbow_angle_deg": round(float(out.elbow_angle_deg.min()), 1),
        "max_hip_shoulder_sep_deg": round(float(out.hip_shoulder_sep_deg.abs().max()), 1),
        "mean_landmark_visibility": round(float(df.filter(like="_v").mean().mean()), 3),
    }
    return out, metrics

def _clean(o):
    if isinstance(o, dict):
        return {k: _clean(v) for k, v in o.items()}
    if isinstance(o, (list, tuple)):
        return [_clean(v) for v in o]
    if isinstance(o, (np.floating, float)):
        return None if not math.isfinite(o) else float(o)
    if isinstance(o, np.integer):
        return int(o)
    return o

def legacy_csv(df, m):
    s = "r" if m["handedness"] == "R" else "l"
    out = pd.DataFrame({
        "pitcher_id": m.get("pitcher_name") or m.get("pitcher_id", ""),
        "handedness": "Right" if s == "r" else "Left",
        "height_cm": m["height_cm"], "weight_kg": m["weight_kg"],
        "upper_arm_cm": m["upper_arm_cm"], "forearm_cm": m["forearm_cm"],
        "camera_role": m["camera_role"],
        "timestamp": df["t_ms"] / 1000.0, "frame_index": df["frame"],
    })
    for j in ("shoulder", "elbow", "wrist", "hip"):
        out[f"{j}_x"] = df[f"{s}_{j}_x"] * m["width"]
        out[f"{j}_y"] = df[f"{s}_{j}_y"] * m["height"]
    out["visibility_elbow"] = df[f"{s}_elbow_v"]
    return out.to_csv(index=False)

def finalize(frames_json, meta_json):
    frames, meta = json.loads(frames_json), json.loads(meta_json)
    rows = [row_from_lm(f["i"], f["t"], f["lm"]) for f in frames if len(f["lm"]) >= 33]
    df = pd.DataFrame(rows).drop_duplicates("frame").sort_values("frame").reset_index(drop=True)
    if len(df) < 10:
        raise ValueError("偵測到人體的影格太少（<10），請確認投手完整入鏡、光線足夠")
    out, metrics = analyze(df, meta)
    return json.dumps(_clean({"metrics": metrics, "raw_csv": df.to_csv(index=False),
                              "kinematics_csv": out.to_csv(index=False), "legacy_csv": legacy_csv(df, meta)}))

def dynamics(raw_csv, meta_json, params_json):
    df = pd.read_csv(io.StringIO(raw_csv))
    meta, params = json.loads(meta_json), json.loads(params_json)
    cf = params.pop("calibration_factor", None)
    out, metrics = biomech.run(df, meta, **{k: v for k, v in params.items() if v is not None})
    metrics["assessment"] = thresholds.assess(meta, metrics, calibration_factor=cf)
    return json.dumps(_clean({"metrics": metrics, "csv": out.to_csv(index=False)}))
</script>

<script type="text/plain" id="py-biomech">
"""逆向動力學：手(+球) → 腕 → 肘 的牛頓‑歐拉運算。"""
import numpy as np
import pandas as pd
from scipy.signal import butter, filtfilt

G = np.array([0.0, -9.81, 0.0])
BSP = {"upper_arm": (0.028, 0.436, 0.322), "forearm": (0.016, 0.430, 0.303), "hand": (0.006, 0.506, 0.297)}
LEN_FRAC = {"upper_arm": 0.186, "forearm": 0.146, "hand": 0.108}
_trapz = getattr(np, "trapezoid", None) or np.trapz

def _unit(v):
    return v / np.maximum(np.linalg.norm(v, axis=1, keepdims=True), 1e-9)

def _lowpass(x, fs, fc):
    b, a = butter(2, min(fc, 0.45 * fs) / (fs / 2))
    return filtfilt(b, a, x, axis=0)

def _omega(u, dt):
    return np.cross(u, np.gradient(u, dt, axis=0))

def _fill_short_gaps(x, fs, max_gap_s=0.06):
    y, n = x.copy(), 0
    bad = ~np.isfinite(y)
    if not bad.any() or bad.all():
        return y, 0
    idx = np.flatnonzero(bad)
    for seg in np.split(idx, np.flatnonzero(np.diff(idx) > 1) + 1):
        a, c = seg[0], seg[-1]
        if a > 0 and c < len(y) - 1 and (c - a + 1) / fs <= max_gap_s:
            y[a:c + 1] = np.interp(np.arange(a, c + 1), [a - 1, c + 1], [y[a - 1], y[c + 1]])
            n += len(seg)
    return y, n

def _hampel(x, k, n_sigma=5.0):
    y, n_fix = x.copy(), 0
    for i in range(len(x)):
        w = x[max(0, i - k): i + k + 1]
        w = w[np.isfinite(w)]
        if len(w) < 3 or not np.isfinite(x[i]):
            continue
        med = np.median(w)
        mad = 1.4826 * np.median(np.abs(w - med))
        if mad > 0 and abs(x[i] - med) > n_sigma * mad:
            y[i], n_fix = med, n_fix + 1
    return y, n_fix

def _I(u, It, w):
    par = (u * w).sum(1, keepdims=True) * u
    It = np.asarray(It, dtype=float)
    if It.ndim == 1:
        It = It[:, None]
    return It * (w - par) + 0.05 * It * par

def _r(x, n=2):
    return None if x is None or not np.isfinite(x) else round(float(x), n)

def run(df, meta, cutoff_hz=6.0, ball_kg=0.145, fc_ms=None, br_ms=None, mer_ms=None, mer_deg=None, mer_offset_deg=0.0, ball_offset_m=0.0, despike=True):
    W_kg = float(meta.get("weight_kg") or 0)
    if W_kg <= 0:
        raise ValueError("需要體重 weight_kg > 0")
    H_m = float(meta.get("height_cm") or 0) / 100
    right = meta["handedness"] == "R"
    s, lead = ("r", "l") if right else ("l", "r")
    need = [f"{s}_{j}_{c}" for j in ("shoulder", "elbow", "wrist", "pinky", "index") for c in "xyz"]
    if any(c not in df.columns for c in need):
        raise ValueError("此錄影缺少手部關節資料，請用新版前端重新錄影")
    if len(df) < 30:
        raise ValueError("影格太少（< 30）")

    t_raw = df["t_ms"].to_numpy() / 1000.0
    fs = float(np.clip(round(1.0 / np.median(np.diff(t_raw))), 20, 1000))
    dt = 1.0 / fs
    t = np.arange(t_raw[0], t_raw[-1], dt)

    def pt(name):
        c = [np.interp(t, t_raw, df[f"{name}_{k}"].to_numpy()) for k in "xyz"]
        return np.c_[c[0] * meta["width"], -c[1] * meta["height"], -c[2] * meta["width"]]

    P = {n: pt(f"{s}_{n}") for n in ("shoulder", "elbow", "wrist", "pinky", "index")}
    L_ua = (meta.get("upper_arm_cm") or 0) / 100 or LEN_FRAC["upper_arm"] * H_m
    L_fa = (meta.get("forearm_cm") or 0) / 100 or LEN_FRAC["forearm"] * H_m
    L_h = LEN_FRAC["hand"] * H_m
    if min(L_ua, L_fa, L_h) <= 0:
        raise ValueError("需要身高，或上臂與前臂長度")

    s1 = L_ua / np.percentile(np.linalg.norm(P["elbow"] - P["shoulder"], axis=1), 90)
    s2 = L_fa / np.percentile(np.linalg.norm(P["wrist"] - P["elbow"], axis=1), 90)
    sc = (s1 + s2) / 2
    f_ = lambda a: _lowpass(a * sc, fs, cutoff_hz)
    S, E, W, K = f_(P["shoulder"]), f_(P["elbow"]), f_(P["wrist"]), f_((P["pinky"] + P["index"]) / 2)
    def opt(name):
        return f_(pt(name)) if f"{name}_x" in df.columns else None
    ank, piv = opt(f"{lead}_ankle"), opt(f"{s}_ankle")
    LS, RS, LH, RH = (opt(n) for n in ("l_shoulder", "r_shoulder", "l_hip", "r_hip"))

    d1 = lambda a: np.gradient(a, dt, axis=0)
    Gf = E + BSP["forearm"][1] * (W - E)
    Gh = W + BSP["hand"][1] * (K - W)
    a_Gf, a_Gh = d1(d1(Gf)), d1(d1(Gh))
    hand_speed = np.linalg.norm(d1(K), axis=1)

    warn, edge = [], 5
    ib = int(np.argmin(abs(t - br_ms / 1000))) if br_ms is not None else edge + int(np.argmax(hand_speed[edge:-edge]))
    t_br = t[ib]
    if fc_ms is not None:
        t_fc, src = fc_ms / 1000.0, "manual"
    else:
        t_fc, src = None, "auto"
        if ank is not None:
            sa = np.linalg.norm(d1(ank), axis=1)
            lo = int(np.searchsorted(t, t_br - 0.8))
            if ib - lo > 5:
                ip = lo + int(np.argmax(sa[lo:ib]))
                below = np.where(sa[ip:ib] < 0.2 * sa[ip])[0]
                if len(below):
                    t_fc = t[ip + below[0]]
        if t_fc is None:
            t_fc = t_br - 0.15
            warn.append("無法由前腳踝偵測 FC，暫以 BR 前 150 ms 代替；建議手動指定 fc_ms")
    if t_fc >= t_br:
        raise ValueError("FC 必須早於 BR，請手動指定 fc_ms / br_ms")
    win = (t >= t_fc) & (t <= t_br)
    if win.sum() < 3:
        raise ValueError("FC–BR 區間內影格不足")

    ifc = int(np.argmin(abs(t - t_fc)))

    vh = d1(K)[ib][[0, 2]]
    dirn = vh / np.linalg.norm(vh) if hand_speed[ib] > 0 and np.linalg.norm(vh) > 0.3 * hand_speed[ib] else None
    uf0 = _unit(W - E)
    er = ((np.degrees(np.arctan2(uf0[:, 1], uf0[:, [0, 2]] @ dirn)) + 90) % 360 - 90) if dirn is not None else None
    if mer_ms is not None:
        t_mer, mer_src = float(mer_ms) / 1000.0, "manual"
    else:
        t_mer, mer_src = None, "auto"
        if er is not None:
            idx = np.where(win)[0]
            im = idx[int(np.argmax(er[idx]))]
            if idx[0] < im < idx[-1]:
                t_mer = t[im]
        if t_mer is None:
            t_mer = t_fc + 0.8 * (t_br - t_fc)
            warn.append("無法由前臂後仰判斷 MER，暫取 FC→BR 的 80% 處")
        warn.append("MER 為估計值；建議在檢視器手動標記 FC / MER / BR 以提高分期準確度")
    t_mer = min(max(t_mer, t_fc), t_br)
    cock = (t >= t_fc) & (t < t_mer)
    acc = (t >= t_mer) & (t <= t_br)

    m_f, m_h = BSP["forearm"][0] * W_kg, BSP["hand"][0] * W_kg
    It_f = m_f * (BSP["forearm"][2] * L_fa) ** 2
    It_h = m_h * (BSP["hand"][2] * L_h) ** 2
    u_h, u_f, u_u = _unit(K - W), _unit(W - E), _unit(E - S)
    w_h, w_f, w_u = _omega(u_h, dt), _omega(u_f, dt), _omega(u_u, dt)
    al_h, al_f = d1(w_h), d1(w_f)

    m_b = np.where(t <= t_br, ball_kg, 0.0)
    K_ball = K + ball_offset_m * u_h
    m_hb = m_h + m_b
    Ghb = (m_h * Gh + m_b[:, None] * K_ball) / m_hb[:, None]
    It_hb = It_h + m_h * np.linalg.norm(Gh - Ghb, axis=1) ** 2 + m_b * np.linalg.norm(K_ball - Ghb, axis=1) ** 2
    a_Kb = d1(d1(K_ball))

    F_w = m_h * (a_Gh - G) + m_b[:, None] * (a_Kb - G)
    tau_w = _I(u_h, It_hb, al_h) + np.cross(w_h, _I(u_h, It_hb, w_h)) - np.cross(W - Ghb, F_w)

    F_e = F_w + m_f * (a_Gf - G)
    tau_e = (tau_w + _I(u_f, It_f, al_f) + np.cross(w_f, _I(u_f, It_f, w_f))
             - np.cross(E - Gf, F_e) + np.cross(W - Gf, F_w))

    cr = np.cross(E - S, W - E)
    sin_ang = np.linalg.norm(cr, axis=1) / (np.linalg.norm(E - S, axis=1) * np.linalg.norm(W - E, axis=1) + 1e-9)
    f = _unit(cr); f[sin_ang < 0.05] = np.nan
    med = f * (-1.0 if right else 1.0)
    F_med = (F_e * med).sum(1)
    F_ax = (F_e * u_f).sum(1)
    T_var = (tau_e * np.cross(u_f, med)).sum(1)
    T_flex = (tau_e * f).sum(1)

    axis_bad = ~np.isfinite(f[:, 0])
    n_fill = n_spike = 0
    k_h = max(2, int(round(0.02 * fs)))
    cleaned = []
    for arr in (F_med, T_var, T_flex):
        arr, nf = _fill_short_gaps(arr, fs)
        n_fill += nf
        if despike:
            arr, ns = _hampel(arr, k_h)
            n_spike += ns
        cleaned.append(arr)
    F_med, T_var, T_flex = cleaned

    P_joint = (tau_e * (w_f - w_u)).sum(1)
    P_fore = (tau_e * w_f).sum(1)

    def work(p, m):
        return {"net_J": round(float(_trapz(p[m], t[m])), 2),
                "positive_J": round(float(_trapz(np.maximum(p[m], 0), t[m])), 2),
                "negative_J": round(float(_trapz(np.minimum(p[m], 0), t[m])), 2)}

    def peak(a):
        b = np.where(win & np.isfinite(a), a, -np.inf)
        i = int(np.argmax(b))
        return (None, None) if not np.isfinite(b[i]) else (float(a[i]), round(float((t[i] - t_br) * 1000), 1))

    (pm, pm_t), (pv, pv_t), (pf, pf_t) = peak(F_med), peak(T_var), peak(T_flex)
    r2 = lambda x: None if x is None else round(x, 2)
    metrics = {
        "events": {"fc_ms": round(t_fc * 1000, 1), "mer_ms": round(t_mer * 1000, 1), "br_ms": round(t_br * 1000, 1),
                   "source": src, "mer_source": mer_src},
        "peak_elbow_medial_force_N": r2(pm), "peak_elbow_medial_force_kgf": r2(pm and pm / 9.81),
        "peak_elbow_medial_force_pct_BW": r2(pm and pm / (W_kg * 9.81) * 100), "medial_force_time_rel_BR_ms": pm_t,
        "peak_elbow_varus_torque_Nm": r2(pv), "varus_torque_time_rel_BR_ms": pv_t,
        "peak_elbow_flexion_torque_Nm": r2(pf), "flexion_torque_time_rel_BR_ms": pf_t,
        "work_FC_to_BR_joint_power": work(P_joint, win),
        "work_FC_to_BR_on_forearm_power": work(P_fore, win),
        "work_by_phase_joint_power": {"cocking": work(P_joint, cock), "acceleration": work(P_joint, acc)},
        "fs_hz": fs, "cutoff_hz": cutoff_hz, "scale_consistency_upperarm_vs_forearm": round(float(s1 / s2), 3),
        "warnings": warn,
        "accuracy_note": "單鏡頭姿態估計＋二次微分，數值適合同一投手的前後比較，不等同動作捕捉實驗室絕對值",
    }
    def pstat(a, m_):
        x = a[m_ & np.isfinite(a)]
        return (None, None) if len(x) == 0 else (float(x.max()), float(x.mean()))

    metrics["phases"] = {}
    for nm, m_ in (("cocking", cock), ("acceleration", acc)):
        (vp, vm), (fp, fm) = pstat(T_var, m_), pstat(F_med, m_)
        metrics["phases"][nm] = {"frames": int(m_.sum()), "varus_peak_Nm": _r(vp), "varus_mean_Nm": _r(vm),
                                 "medial_peak_N": _r(fp), "medial_mean_N": _r(fm)}

    nan = np.full(len(t), np.nan)
    have_trunk = all(x is not None for x in (LS, RS, LH, RH))
    if have_trunk:
        down = (LH + RH) / 2 - (LS + RS) / 2
        abd = np.degrees(np.arccos(np.clip((_unit(E - S) * _unit(down)).sum(1), -1, 1)))
        az = lambda p, q: np.degrees(np.arctan2((q - p)[:, 2], (q - p)[:, 0]))
        sep = (az(LS, RS) - az(LH, RH) + 180) % 360 - 180
    else:
        abd, sep = nan, nan
    flex = 180 - np.degrees(np.arccos(np.clip((_unit(S - E) * _unit(W - E)).sum(1), -1, 1)))
    imer = int(np.argmin(abs(t - t_mer)))
    wide = (t >= t_fc - 0.25) & (t <= t_br)
    stride, basis = None, None
    if ank is not None and piv is not None:
        dx, dz = (ank - piv)[ifc, 0], (ank - piv)[ifc, 2]
        side_cam = "side" in str(meta.get("camera_role", "")).lower()
        stride, basis = (abs(dx), "image_plane_x") if side_cam else (float(np.hypot(dx, dz)), "horizontal_xz")
    metrics["kinematics"] = {
        "stride_m": _r(stride), "stride_basis": basis,
        "stride_pct_height": _r(stride / H_m * 100, 1) if stride is not None and H_m > 0 else None,
        "shoulder_abduction_at_fc_deg": _r(abd[ifc], 1), "elbow_flexion_at_fc_deg": _r(flex[ifc], 1),
        "hip_shoulder_sep_at_fc_deg": _r(sep[ifc], 1), "hip_shoulder_sep_at_mer_deg": _r(sep[imer], 1),
        "max_hip_shoulder_sep_deg": _r(np.nanmax(np.abs(sep[wide])), 1) if have_trunk else None,
    }

    reg = {"formula": "PEVT = -1.666·MER - 2.377·屈曲@BR + 1.554·屈曲@PEVT - 0.279·EFtime + 364.973",
           "cycle": "投球週期＝FC(0%)→BR(100%)", "mer_offset_deg": float(mer_offset_deg)}
    okT = win & np.isfinite(T_var) & np.isfinite(flex)
    if okT.any():
        ip = int(np.argmax(np.where(okT, T_var, -np.inf)))
        ie = int(np.argmax(np.where(win & np.isfinite(flex), flex, -np.inf)))
        ef_time = (t[ie] - t_fc) / (t_br - t_fc) * 100
        mer_abs = float(mer_deg) if mer_deg is not None else (float(np.nanmax(er[win])) if er is not None else None)
        fl_br, fl_pv = float(flex[ib]), float(flex[ip])
        reg["inputs"] = {"mer_deg": _r(mer_abs, 1), "mer_source": "manual" if mer_deg is not None else "estimated",
                         "elbow_flexion_at_br_deg": _r(fl_br, 1), "elbow_flexion_at_pevt_deg": _r(fl_pv, 1),
                         "ef_time_pct": _r(ef_time, 1), "pevt_time_pct": _r((t[ip] - t_fc) / (t_br - t_fc) * 100, 1)}
        if mer_abs is None:
            reg["note"] = "無法估計 MER 角度，請手動輸入 MER 角度"
        elif not (60 <= mer_abs <= 240 and 0 <= fl_br <= 180 and 0 <= fl_pv <= 180 and 0 <= ef_time <= 100):
            reg["note"] = "輸入超出合理範圍，不計算預測值"
        else:
            pred = -1.666 * (mer_abs - mer_offset_deg) - 2.377 * fl_br + 1.554 * fl_pv - 0.279 * ef_time + 364.973
            reg["sensitivity_per_10deg_mer"] = round(-16.66, 2)
            if pred <= 0:
                reg["note"] = f"預測值 {pred:.1f} ≤ 0，不符物理意義"
            else:
                reg["predicted"] = _r(pred)
    else:
        reg["note"] = "FC–BR 區間內資料不足"
    reg["measured_peak_valgus_torque_Nm"] = metrics["peak_elbow_varus_torque_Nm"]
    metrics["regression_pevt"] = reg
    metrics["quality"] = {"axis_undefined_pct_in_window": _r(float(axis_bad[win].mean() * 100), 1),
                          "interpolated_samples": int(n_fill), "despiked_samples": int(n_spike),
                          "ball_model": "手+球合成質心與平行軸慣量；球離手後退回純手"}
    if axis_bad[win].mean() > 0.1:
        warn.append("FC–BR 區間內超過 10% 影格手臂接近伸直，內側力/內翻力矩已內插，峰值請保守解讀")

    if not 0.8 <= s1 / s2 <= 1.25:
        warn.append("上臂/前臂尺度估計差異大，力與力矩可能偏差")

    out = pd.DataFrame({
        "t_ms": t * 1000, "in_FC_BR_window": win.astype(int), "hand_speed_m_s": hand_speed,
        "elbow_medial_force_N": F_med, "elbow_axial_force_N": F_ax,
        "elbow_varus_torque_Nm": T_var, "elbow_flexion_torque_Nm": T_flex,
        "forearm_omega_rad_s": np.linalg.norm(w_f, axis=1),
        "elbow_power_joint_W": P_joint, "elbow_power_on_forearm_W": P_fore,
        "shoulder_abduction_deg": abd, "elbow_flexion_deg": flex, "hip_shoulder_sep_deg": sep,
        "phase": np.where(cock, 1, np.where(acc, 2, 0)),
        "shoulder_er_proxy_deg": er if er is not None else nan, "axis_undefined": axis_bad.astype(int),
    }).round(4)
    return out, metrics
</script>

<script type="text/plain" id="py-thresholds">
"""示警門檻與風險評估模組。"""
import statistics

ORDER = {"n/a": -2, "info": -1, "normal": 0, "watch": 1, "alert": 2, "high": 3}
STAT = "peak"
ADULT_MIN_AGE = 18

CALIBRATION_FACTOR = 1.0
CAL_RANGE = (0.5, 2.0)

_PENDING = "使用者提供之常模（原始文獻出處待補）"
REFERENCES = {
    "inverse_dynamics": "Feltner M, Dapena J. (1986). Dynamics of the shoulder and elbow joints of the throwing arm during a baseball pitch. Int J Sport Biomech 2:235–259",
    "bsp": "Winter DA. (2009). Biomechanics and Motor Control of Human Movement, 4th ed. Wiley",
    "pevt_model": "Nebel AR, Schmitt AC. Predicting elbow valgus torque from upper extremity baseball pitching kinematics using markerless motion capture. Sports Med Health Sci 2026;8(4):426–430. doi:10.1016/j.smhs.2025.02.006",
}
SOURCES = {k: _PENDING for k in (
    "kinetic_youth", "gird", "trunk_mer", "trunk_max", "stride_adult", "stride_youth", "abduction_fc", "elbow_flexion_fc")}
SOURCES["kinetic_adult"] = ("Fleisig GS, Barrentine SW, Zheng N, Escamilla RF, Andrews JR. (1999). Kinematic and kinetic comparison of baseball pitching "
                            "among various levels of development. J Biomech 32(12):1371–1375")
SOURCES["pevt_model"] = REFERENCES["pevt_model"]

_N = lambda label, unit, mean, sd, alert: dict(label=label, unit=unit, mean=mean, sd=sd, alert=alert)
KINETIC = {
    "youth": {
        ("cocking", "varus"): _N("手臂後拉期 肘內翻力矩", "N·m", 43.27, 9.66, 51.21),
        ("acceleration", "varus"): _N("手臂加速期 肘內翻力矩", "N·m", 20.82, 12.87, 32.0),
        ("cocking", "medial"): _N("手臂後拉期 肘內側力", "N", 185.58, 47.44, 236.75),
        ("acceleration", "medial"): _N("手臂加速期 肘內側力", "N", 96.26, 53.29, 144.08),
    },
    "adult": {
        ("cocking", "varus"): _N("手臂後拉期 肘內翻力矩", "N·m", 64.0, 12.0, 76.0),
        ("acceleration", "varus"): _N("手臂加速期 肘內翻力矩", "N·m", 32.0, 14.0, 46.0),
        ("cocking", "medial"): _N("手臂後拉期 肘內側力", "N", 310.0, 60.0, 370.0),
        ("acceleration", "medial"): _N("手臂加速期 肘內側力", "N", 160.0, 70.0, 230.0),
    },
}

def _item(key, label, value, unit, level, rule, *, rel="", rel_level="", source="", correction="", note="", raw=None):
    r = lambda x: None if x is None else round(float(x), 2)
    return {"key": key, "label": label, "unit": unit, "level": level, "rule": rule, "value": r(value), "value_raw": r(raw),
            "source": source or SOURCES.get(key, ""), "reliability": rel, "reliability_level": rel_level,
            "correction": correction, "note": note}

def _na(key, label, unit, why, rule="", **kw):
    return _item(key, label, None, unit, "n/a", rule, note=why, **kw)

def _trunk_norm(age):
    if age is None or age < 9:
        return None
    k = min(1.0, (age - 9) / 6.0)
    return 23 + k * 19, 2 + k * 1

def assess(meta, m, calibration_factor=None):
    cf = CALIBRATION_FACTOR if calibration_factor is None else float(calibration_factor)
    if not CAL_RANGE[0] <= cf <= CAL_RANGE[1]:
        raise ValueError(f"calibration_factor 需介於 {CAL_RANGE[0]}–{CAL_RANGE[1]}")
    items, ph, kin, q = [], m.get("phases", {}), m.get("kinematics", {}), m.get("quality", {})
    age = meta.get("age")
    group = None if age is None else ("adult" if age >= ADULT_MIN_AGE else "youth")

    norms, cap_to, norm_note = KINETIC.get(group) if group else None, None, ""
    if norms is None:
        norms, set_name = KINETIC["youth"], "youth"
        if group == "adult":
            cap_to, norm_note = "watch", f"≥{ADULT_MIN_AGE} 歲但尚無成人常模，暫用青少年常模"
        else:
            norm_note = "未填年齡，暫用青少年常模"
    else:
        set_name = group
    for (phase, kind), c in norms.items():
        key = f"{kind}_{phase}"
        raw = (ph.get(phase) or {}).get(f"{kind}_{STAT}_{c['unit'].replace('·', '')}")
        high = c["mean"] + 2 * c["sd"]
        rule = f"常模 {c['mean']}±{c['sd']} {c['unit']}（{set_name}）；≥{c['alert']} 示警；≥{high:.2f}（+2SD）高風險"
        src = SOURCES["kinetic_" + set_name]
        rel = dict(rel="低：單鏡頭姿態估計＋二次微分，與動作捕捉常模直接比較誤差大", rel_level="low", source=src)
        if raw is None:
            items.append(_na(key, c["label"], c["unit"], "此期間影格不足", rule, **rel))
            continue
        v = raw * cf
        lv = "high" if v >= high else "alert" if v >= c["alert"] else "normal"
        corr = []
        if cf != 1:
            corr.append(f"單鏡頭校正 ×{cf:g}")
        if cap_to and ORDER[lv] > ORDER[cap_to]:
            lv = cap_to
        if norm_note:
            corr.append(norm_note)
        items.append(_item(key, c["label"], v, c["unit"], lv, rule, raw=raw, correction="；".join(corr), **rel))

    t_rom, o_rom = meta.get("ir_rom_throw_deg"), meta.get("ir_rom_other_deg")
    tr_t, tr_o = meta.get("ir_trials_throw") or [], meta.get("ir_trials_other") or []
    rule = "兩側內旋差 ≥20° 觸發 GIRD 高風險；8.3–20° 為注意區"
    if t_rom is None or o_rom is None:
        items.append(_na("gird", "肩內旋活動度缺損 (GIRD)", "°", "未量測", rule))
    else:
        d = o_rom - t_rom
        lv = "high" if d >= 20 else "watch" if d >= 8.3 else "normal"
        items.append(_item("gird", "肩內旋活動度缺損 (GIRD)", d, "°", lv, rule))

    scored = [i for i in items if ORDER[i["level"]] >= 0]
    overall = max((i["level"] for i in scored), key=lambda l: ORDER[l], default="n/a")
    return {"overall": overall, "items": items, "flagged": [i["key"] for i in scored if ORDER[i["level"]] >= 1],
            "calibration_factor": cf, "age_group": group, "kinetic_norm_set": set_name,
            "references": ["逆向動力學：" + REFERENCES["inverse_dynamics"], "體段參數：" + REFERENCES["bsp"], "PEVT 迴歸式：" + REFERENCES["pevt_model"]],
            "disclaimer": "常模多來自動作捕捉研究；本系統為單鏡頭姿態估計，數值僅供篩檢與同一投手的趨勢追蹤。"}
</script>
